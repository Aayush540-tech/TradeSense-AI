version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tradesense_backend
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      - APP_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=8080
    env_file:
      - backend/.env
    depends_on:
      - redis
    networks:
      - tradesense-net

  redis:
    image: redis:7-alpine
    container_name: tradesense_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - tradesense-net

volumes:
  redis_data:

networks:
  tradesense-net:
    driver: bridge
